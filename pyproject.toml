[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "npy-contract"
version = "0.1.0"
description = "Check dense NPY delivery contracts without loading array payloads"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KanadeK"}]
keywords = ["numpy", "npy", "data-validation", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
npy-contract = "npy_contract.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/npy-contract"
Issues = "https://github.com/KanadeK/npy-contract/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
